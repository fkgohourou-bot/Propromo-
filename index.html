<style>button{cursor:pointer;-webkit-tap-highlight-color:transparent;}

:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:-webkit-fill-available;}


*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior-y:none;background:#F7F8FA;font-size:16px;color:#1A2B4A;}
button,input,select,textarea{font-family:inherit;font-size:16px;}
.go{background:linear-gradient(135deg,#F97316,#F59E0B);} .gp{background:linear-gradient(135deg,#DB2777,#EC4899);}
.gb{background:linear-gradient(135deg,#2563EB,#7C3AED);} .gg{background:linear-gradient(135deg,#16A34A,#059669);}
.gd{background:linear-gradient(135deg,#1B3A6B,#0F2345);}
.page{min-height:100vh;background:#F7F8FA;padding-bottom:30px;}
.wrap{padding:18px;max-width:680px;margin:0 auto;}
.topbar{padding:14px 18px;display:flex;align-items:center;gap:12px;position:-webkit-sticky;position:sticky;top:0;z-index:100;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 2px 20px rgba(0,0,0,.2);}
.tb-logo{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;flex-shrink:0;}
.tb-name{font-weight:800;font-size:16px;color:#fff;}
.tb-role{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;}
.tb-btn{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-left:auto;}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 2px 16px rgba(0,0,0,.07);margin-bottom:16px;}
.card-title{font-size:17px;font-weight:800;color:#0F172A;margin-bottom:18px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-box{background:#fff;border-radius:18px;padding:20px 14px;box-shadow:0 2px 16px rgba(0,0,0,.07);text-align:center;}
.tabs{display:flex;gap:4px;background:#E2E8F0;border-radius:14px;padding:4px;margin-bottom:20px;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:11px 14px;border-radius:11px;border:none;background:transparent;color:#64748B;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;position:relative;}
.tab.on{background:#fff;color:#1A2B4A;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.notif{position:absolute;top:5px;right:5px;background:#EF4444;color:#fff;border-radius:20px;font-size:9px;font-weight:900;padding:2px 6px;min-width:16px;text-align:center;}
.btn{border:none;border-radius:14px;padding:14px 20px;font-weight:800;font-size:15px;cursor:pointer;color:#fff;}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:11px;}
.btn-full{width:100%;display:block;text-align:center;}
.btn-ghost{background:#F1F5F9;color:#334155;}
.btn-danger{background:#FEE2E2;color:#DC2626;}
.btn-warn{background:#FEF3C7;color:#B45309;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:14px;font-weight:700;color:#334155;margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;border:1.5px solid #E2E8F0;border-radius:12px;padding:14px 16px;font-size:16px;outline:none;background:#fff;color:#1A2B4A;}
.field textarea{resize:vertical;min-height:80px;}
.req{color:#EF4444;}
.item{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#F8FAFC;border-radius:14px;border:1.5px solid #EDF2F7;margin-bottom:10px;}
.item-av{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.badge-wait{background:#FEF3C7;color:#B45309;}
.badge-ok{background:#DCFCE7;color:#16A34A;}
.badge-off{background:#FEE2E2;color:#DC2626;}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:24px 22px 44px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;}
.sh-bar{width:40px;height:4px;background:#E2E8F0;border-radius:2px;margin:0 auto 20px;}
.sh-title{font-size:20px;font-weight:900;color:#1A2B4A;margin-bottom:20px;}
.err{background:#FEF2F2;border-left:4px solid #EF4444;border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;color:#DC2626;margin-bottom:14px;}
.ok{background:#F0FDF4;border-left:4px solid #16A34A;border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;color:#15803D;margin-bottom:14px;}
.msg{background:#EFF6FF;border-left:4px solid #2563EB;border-radius:0 14px 14px 0;padding:14px 16px;font-size:15px;color:#1A2B4A;line-height:1.5;margin-bottom:10px;}
.info-box{background:linear-gradient(135deg,#EFF6FF,#F5F3FF);border:1.5px solid #BFDBFE;border-radius:14px;padding:18px;margin-bottom:16px;}
.calc{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:2px solid #F97316;border-radius:14px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}
.cbar{position:-webkit-sticky;position:sticky;top:0;z-index:100;padding-top:calc(14px + env(safe-area-inset-top,0px));padding:12px 18px;box-shadow:0 4px 24px rgba(0,0,0,.28);}
.cbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.cnum{font-weight:900;font-size:60px;line-height:1;min-width:66px;text-align:center;display:inline-block;color:#F97316;}
.c-btn{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
.chip{padding:12px 18px;border-radius:14px;border:2px solid #E2E8F0;background:#fff;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#334155;margin:0 8px 8px 0;}
.chip.sel{border-color:#F97316;background:#FFF7ED;color:#F97316;box-shadow:0 0 0 4px rgba(249,115,22,.12);}
.civ-btn{flex:1;padding:14px;border-radius:13px;border:2px solid #E2E8F0;background:#fff;font-weight:700;font-size:15px;cursor:pointer;color:#334155;font-family:inherit;}
.civ-btn.on{border-color:#2563EB;background:#EFF6FF;color:#2563EB;}
.avis-btn{flex:1;min-width:0;padding:8px 4px;border-radius:12px;border:2px solid #E2E8F0;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;}
.avis-btn .em{font-size:24px;} .avis-btn .al{font-size:10px;font-weight:700;color:#94A3B8;}
.eval{background:#F8FAFC;border-radius:14px;padding:16px;margin-bottom:14px;}
.avis-row{display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;margin-bottom:12px;overflow-x:auto;}
.achat-btn{flex:1;padding:14px;border-radius:13px;border:2px solid #E2E8F0;background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
.achat-btn.oui{border-color:#16A34A;background:#F0FDF4;color:#16A34A;}
.achat-btn.non{border-color:#EF4444;background:#FEF2F2;color:#DC2626;}
.stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.stock-cell{background:#F8FAFC;border-radius:13px;padding:14px 10px;border:1.5px solid #E8EDF3;text-align:center;}
.tbl{width:100%;border-collapse:collapse;font-size:14px;}
.tbl th{padding:12px 14px;font-weight:700;color:#334155;background:#F1F5F9;text-align:left;}
.tbl td{padding:14px;border-bottom:1.5px solid #F1F5F9;}
.tbl tfoot td{padding:14px;background:#F1F5F9;font-weight:800;}
.tier-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#F8FAFC;border-radius:11px;border:1.5px solid #E8EDF3;margin-bottom:8px;}
.tier-input{width:120px;border:2px solid #E2E8F0;border-radius:9px;padding:9px 12px;font-size:15px;font-weight:800;outline:none;font-family:inherit;}
.login-bg{min-height:100vh;background:linear-gradient(160deg,#1E3A6E 0%,#2E5AA8 50%,#1E3A6E 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));min-height:100dvh;}
.lcard{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 12px 48px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.1);}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.2);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.2);opacity:1}} @keyframes cpulse{0%{transform:scale(1);}45%{transform:scale(1.42);text-shadow:0 0 36px #F97316;}100%{transform:scale(1);}}
.anim{animation:cpulse .55s cubic-bezier(.34,1.56,.64,1);}
.pending-section{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:2px solid #FDE68A;border-radius:16px;padding:18px;margin-bottom:16px;}
.pending-title{font-size:15px;font-weight:800;color:#92400E;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
@media print{.no-print{display:none!important;}body{background:#fff;}}
.inv{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center;padding:20px;}
.inv.show{display:flex;}

input:focus,select:focus,textarea:focus{border:2px solid #0F172A !important;box-shadow:none;}
.item-av{width:44px;height:44px;border-radius:13px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;line-height:1;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat-box{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;border:1px solid #E2E8F0;display:flex;flex-direction:column;align-items:center;}
.tab{flex-shrink:0;white-space:nowrap;padding:9px 14px;border-radius:9px 9px 0 0;border:none;background:transparent;color:#94A3B8;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;margin-bottom:-1.5px;}
.tab.on{color:#1A2B4A;font-weight:800;border-bottom-color:#F97316;}
.card{border-radius:16px !important;}
.btn{border-radius:14px !important;font-weight:800;}

.item{align-items:center;}

/* Emojis alignés dans le texte */
span[style*="font-size:2"]{vertical-align:middle;line-height:1;}

.btn-full{width:100%;display:flex;}

function svgBars(data,w,h){
if(!data||!data.length) return '<p style="color:#94A3B8;text-align:center;padding:20px;font-size:14px">Aucune donnee</p>';
var n=data.length,bw=(w-(n+1)*6)/n,maxV=1;

var out='<svg width="'+w+'" height="'+h+'" style="overflow:visible;display:block">';
for(var i=0;i<data.length;i++){
var d=data[i],x=6+i*(bw+6),vals=Array.isArray(d.v)?d.v:[d.v],cols=Array.isArray(d.c)?d.c:['#2563EB'],y=h-22;
for(var ci=0;ci<vals.length;ci++){var bh=Math.max(0,(vals[ci]/maxV)*(h-34));y-=bh;out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+(cols[ci]||'#94A3B8')+'" rx="4"/>';}
var tot=vals.reduce(function(a,b){return a+b;},0);
out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-5)+'" text-anchor="middle" font-size="11" fill="#64748B" font-family="system-ui">'+esc(d.name)+'</text>';
if(tot>0)out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2B4A" font-family="system-ui">'+tot+'</text>';
}
return out+'</svg>';
}

}

function exportDB(){

    version:2,
    date:new Date().toISOString(),
    org:G.user.org_id,
    db:G.db
  },null,2);
  var blob=new Blob([payload],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='propromo-backup-'+TODAY+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
}

function importDB(evt){
  var file=evt.target.files[0];
  if(!file){return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var payload=JSON.parse(e.target.result);
      if(!payload.db){alert('Fichier invalide. Veuillez utiliser un fichier exporté depuis PROPROMO.');return;}
      /* Confirmation avant d'écraser */
      if(!confirm('Importer ces données ? Les données actuelles seront remplacées.')){return;}
      G.db=payload.db;
      /* Réinitialiser les structures manquantes */
      if(!G.db.paies)G.db.paies=[];
      if(!G.db.forcages)G.db.forcages=[];
      if(!G.db.pdvs)G.db.pdvs=[];
      saveDB();
      alert('Données importées avec succès ! Reconnectez-vous.');
      logout();
    }catch(err){
      alert('Erreur lors de l\'import : '+err.message);
    }
  };
  reader.readAsText(file);
}

function triggerImport(){
  var inp=document.createElement('input');

function cleanDbForSync(db){
  /* Supprimer les images trop grandes pour Supabase (>100KB en base64) */
  var MAX_IMG=100000; /* 100KB */
  var clean=JSON.parse(JSON.stringify(db));
  if(clean.organisations){
    clean.organisations=clean.organisations.map(function(o){
      if(o.logo&&o.logo.length>MAX_IMG)o.logo=o.logo.substring(0,MAX_IMG);
      return o;
    });
  }
  if(clean.produits){
    clean.produits=clean.produits.map(function(p){
      if(p.image&&p.image.length>MAX_IMG)p.image='';
      return p;
    });
  }
  /* Photos : vider si total > 200KB pour Supabase (photos restent dans localStorage) */
  ['shifts','promotions'].forEach(function(k){
    if(!clean[k])return;
    clean[k]=clean[k].map(function(s){
      var out=Object.assign({},s);
      var tot=(out.photos||[]).reduce(function(a,p){return a+(typeof p==='string'?p.length:p&&p.data?p.data.length:0);},0);
      if(tot>200000){out.photos=[];out.photo=null;}
      return out;
    });
  });
  return clean;
}

          _srv[k].forEach(function(sr){
            /* Point 3: INSERT uniquement les enregistrements absents */
            if(!G.db[k].find(function(l){return String(l.id)===String(sr.id);}))
              G.db[k].push(sr);
          });
        });
        localStorage.setItem('propromo_db',JSON.stringify(G.db));
      }catch(_e){}
    }
    /* Etape 3: Sauvegarder le resultat fusionne (Point 3-4) */
    return fetch(SUPA_URL+'/rest/v1/sync?id=eq.1',{
      method:'PATCH',
      headers:Object.assign({},_supaHdrs(),{'Prefer':'return=minimal'}),
      body:JSON.stringify({ping:new Date().toISOString()})
    });
  })
  .then(function(r){
    /* Point 4: Confirmer sync */
    _fbSyncing=false;_fbConnected=true;_fbLastSync=tn();
    if(_dirtyVersion===_vSave){_localDirty=false;}
    else{setTimeout(supaSave,300);}
    console.log('[PROPROMO] Sync OK v'+_vSave,r.status);
  })
  .catch(function(e){_fbSyncing=false;console.error('[PROPROMO] Err:',e.message);setTimeout(supaSave,5000);});
}

function initFirebase(){

  supaLoad(function(ok){
    _fbLoading=false;
    if(!ok&&G.db.organisations&&G.db.organisations.length>0){supaSave();}
    render();
    /* Pas de polling continu - seulement au chargement initial */
    /* Sync douce toutes les 30s si aucune saisie active */
    setInterval(function(){
      var active=document.activeElement;
      var isTyping=active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.tagName==='SELECT');
      if(!isTyping){
        if(!navigator.onLine){return;} /* Hors ligne : rien à faire, données en localStorage */
        if(_localDirty){
          supaSave();
        } else if(!_fbSyncing&&Date.now()-_supaLastSave>3000){
          supaLoad(function(ok){if(ok){_syncRender=true;render();_syncRender=false;}});
        }
      }
    },5000); /* Sync toutes les 5 secondes pour mise à jour quasi-immédiate entre appareils */
    /* Le bouton ↻ permet une sync manuelle */
  });
  return true;
}

function fbDocRef(){
  return _fbFs.collection('propromo').doc('propromo_7181c');

function fbSave(){supaSave();}



function fbLoad(callback){
  if(!_fbFs){if(callback)callback(false);return;}
  fbDocRef().get()
    .then(function(doc){
      _fbConnected=true;
      if(doc.exists){
        var data=doc.data();
        if(data&&data.db){
          G.db=data.db;
          ['paies','forcages','pdvs'].forEach(function(k){if(!G.db[k])G.db[k]=[];});
          localStorage.setItem('propromo_db',JSON.stringify(G.db));
          console.log('[PROPROMO] DB depuis Firestore');
          if(callback)callback(true);
        }else{if(callback)callback(false);}
      }else{fbSave();if(callback)callback(false);}
    })
    .catch(function(e){
      _fbConnected=false;
      console.error('[PROPROMO] fbLoad:',e.message);
      if(callback)callback(false);
    });
}

function fbStatus(){
  /* Supabase est le backend principal */
  if(!_fbConnected)return{ok:false,msg:'Hors ligne'};
  if(_fbSyncing)return{ok:true,msg:'Sync...'};
  var t=_fbLastSync?(' · '+_fbLastSync):'';
  return{ok:true,msg:'Supabase'+t};
}

function saveFirebaseConfig(cfg){
  /* Lire les champs depuis le DOM si pas de cfg passé */
  if(!cfg){
    var k=document.getElementById('fb_key');
    var a=document.getElementById('fb_auth');
    var p=document.getElementById('fb_pid');
    if(k&&a&&p){
      cfg={apiKey:k.value.trim(),authDomain:a.value.trim(),projectId:p.value.trim()};
    }
  }
  if(cfg&&cfg.apiKey)_FB_CFG.apiKey=cfg.apiKey;
  if(cfg&&cfg.authDomain)_FB_CFG.authDomain=cfg.authDomain;
  if(cfg&&cfg.projectId)_FB_CFG.projectId=cfg.projectId;
  localStorage.setItem('propromo_firebase_config',JSON.stringify(_FB_CFG));
  try{firebase.app('propromo').delete();}catch(e){}
  _fbApp=null;_fbFs=null;_fbConnected=false;
  var ok=initFirebase();
  if(!ok){
    /* Réessayer après 1s si SDK pas encore prêt */
    setTimeout(function(){
      initFirebase();
      fbLoad(function(loaded){
        alert(loaded?'Firebase connecté ! Données chargées.':'Firebase connecté ! Données locales envoyées vers le cloud.');
        render();
      });

  } else {

      render();
    });
  }
}

function saveDB(){
try{
  /* Purge automatique : garder les 100 derniers messages */
  if(G.db&&G.db.messages&&G.db.messages.length>100){
    G.db.messages=G.db.messages.sort(function(a,b){return(a.date||'')>(b.date||'')?1:-1;}).slice(-100);
  }
  /* Persister les paramètres UI critiques dans G.db */
  if(!G.db.config)G.db.config={};
  G.db.config.payeTaux=G.payeTaux;
  G.db.config.commStockDebut=G.commStockDebut;
  G.db.config.commStockFin=G.commStockFin;
  G.db.config.payeDateDu=G.payeDateDu;
  G.db.config.payeDateAu=G.payeDateAu;
  localStorage.setItem('propromo_db',JSON.stringify(G.db));
  /* Ne pas marquer dirty si render déclenché par sync (évite boucle save/load) */
  if(!_syncRender){
    _localDirty=true;
    _dirtyVersion++;
    fbSave();
  }
  /* Sauver aussi la session active */
  if(G.user){
    /* Normaliser : ne sauvegarder que les écrans gérés par page() */
    var _validScreens=['superadmin','responsable','commercial','promotrice-home','promotrice-session'];
    var _roleHome={superadmin:'superadmin',responsable:'responsable',commercial:'commercial',promotrice:'promotrice-home'};

}catch(e){}

function formatWA(num){
var n=(num||'').replace(/[^0-9+]/g,'');
if(n.startsWith('+')) n=n.slice(1); 
if(n.startsWith('225')) return n;   
if(n.startsWith('0')) n=n.slice(1); 
return '225'+n;                      
}

function exportPayePDF(){
  var db=G.db,u=G.user;
  var per=G.payePeriode||TODAY.substring(0,7);
  var taux=G.payeTaux||{fixe:0,variable:0};
  var org=u.org_id?db.organisations.find(function(o){return o.id===u.org_id;}):null;

  var proms=db.utilisateurs.filter(function(p){return p.org_id===u.org_id&&p.role==='promotrice';});
  var rows=[];
  proms.forEach(function(p){
    var dateDu2=G.payeDateDu||(per+'-01');
    var dateAu2=G.payeDateAu||TODAY;
    var shifts=db.shifts.filter(function(s){return s.promotrice_id===p.id&&s.date>=dateDu2&&s.date<=dateAu2;});
    shifts.forEach(function(sh){
      var pdv=(db.pdvs||[]).find(function(v){return v.promotrice_id===p.id;})||null;
      var present=sh.statut==='Cloture'||sh.statut==='En cours';
      var ventes=(db.promotions||[]).filter(function(pr){return pr.promotrice_id===p.id&&pr.date===sh.date;}).reduce(function(a,pr){return a+(+pr.cartons||0);},0);
      var fixe=present?(+taux.fixe||0):0;
      var variable=ventes*(+taux.variable||0);
      rows.push({date:sh.date,pdv:pdv?pdv.nom:'—',promo:p.nom,present:present,statut:sh.statut,ventes:ventes,fixe:fixe,variable:variable,montant:fixe+variable});
    });
  });
  var totVentes=rows.reduce(function(a,r){return a+r.ventes;},0);
  var totFixe=rows.reduce(function(a,r){return a+r.fixe;},0);
  var totVar=rows.reduce(function(a,r){return a+r.variable;},0);

  +'.absent{color:#DC2626;}'

function sendPayeWA(pid){
  var per=G.payePeriode||TODAY.substring(0,7);
  var p=G.db.utilisateurs.find(function(u){return u.id===pid;});
  if(!p||!p.telephone)return;
  var wa='225'+p.telephone.replace(/\D/g,'');
  var sh=G.db.shifts.filter(function(s){return s.promotrice_id===pid&&(s.date||'').substring(0,7)===per;});
  var dg=G.db.degustations.filter(function(d){return sh.some(function(s){return s.id===d.sid;});});
  var ach=dg.filter(function(d){return d.achat;}).length;
  var tx=dg.length?Math.round(ach/dg.length*100):0;
  var cartons=(G.db.promotions||[]).filter(function(pr){return pr.promotrice_id===pid&&(pr.date||'').substring(0,7)===per;}).reduce(function(a,pr){return a+(pr.cartons||0);},0);
  var py=G.db.paies.find(function(py){return py.promotrice_id===pid&&py.periode===per;})||{salaire_base:0,prime_fixe:0,prime_variable:0,statut:'en_attente'};
  var total=(+py.salaire_base||0)+(+py.prime_fixe||0)+(+py.prime_variable||0);
  var msg='Bonjour '+esc(p.nom)+' !\n\n'
    +'📊 *Bilan '+per+'*\n'
    +'• Jours : *'+sh.length+'*\n'
    +'• Dégustations : *'+dg.length+'* ('+tx+'% conversion)\n'
    +'• Cartons : *'+cartons+'*\n\n'
    +'💰 *Fiche de paye*\n'
    +'• Base : '+py.salaire_base+' F\n'
    +'• Prime fixe : '+py.prime_fixe+' F\n'
    +'• Prime variable : '+py.prime_variable+' F\n'
    +'• *TOTAL : '+total+' F CFA*\n'
    +'Statut : '+(py.statut==='payé'?'✅ Payée':'⏳ En attente')+'\n'
    +'\n— PROPROMO by GFK lab';
  window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');
}
function sendPayeGroupWA(){
  var per=G.payePeriode||TODAY.substring(0,7);
  var proms=G.db.utilisateurs.filter(function(u){return u.org_id===G.user.org_id&&u.role==='promotrice';});
  var msg='📋 *Fiches de paye '+per+'*\n\n';

}

function saveCommPdvLocal(){
  var f=G.commPdvForm||{};
  if(!f.nom||!f.nom.trim()){alert('Nom du PDV requis.');return;}
  if(!G.db.pdvs)G.db.pdvs=[];
  if(f.id){
    var p=G.db.pdvs.find(function(p){return p.id===f.id;});
    if(p){Object.assign(p,{nom:f.nom,adresse:f.adresse,contact:f.contact,lat:f.lat,lng:f.lng,promotrice_id:f.promotrice_id,commercial_id:G.user.id});}
  }else{
    G.db.pdvs.push({id:uid(),org_id:G.user.org_id,commercial_id:G.user.id,nom:f.nom,adresse:f.adresse,contact:f.contact,lat:f.lat,lng:f.lng,promotrice_id:f.promotrice_id});
  }
  if(f.promotrice_id){
    var pu=G.db.utilisateurs.find(function(u){return u.id===f.promotrice_id;});
    if(pu)pu.commercial_id=G.user.id;
  }
  G.commPdvEditMode=false;render();
}
function captureCommPdvGps(){
  if(!navigator.geolocation){alert('GPS non disponible.');return;}
  navigator.geolocation.getCurrentPosition(
    function(pos){G.commPdvForm.lat=pos.coords.latitude;G.commPdvForm.lng=pos.coords.longitude;render();},
    function(){
      navigator.geolocation.getCurrentPosition(
        function(pos){G.commPdvForm.lat=pos.coords.latitude;G.commPdvForm.lng=pos.coords.longitude;render();},
        function(){alert('GPS non accessible. Vérifiez les autorisations de localisation dans les paramètres de votre navigateur.');},
        {timeout:20000,enableHighAccuracy:false,maximumAge:300000}
      );
    },
    {timeout:15000,enableHighAccuracy:true,maximumAge:60000}
  );
}

  var prom=p.promotrice_id?G.db.utilisateurs.find(function(u){return u.id===p.promotrice_id;}):null;

  var u=G.user;if(!u)return;

  else if(u.role==='commercial')G.commTab=t;
  else if(u.role==='promotrice'){
    G.promoPTab=t;

    if(t==='deg'&&G.screen==='promotrice-session'){

    } else if(G.screen==='promotrice-session'){

      G.screen='promotrice-home';
    }

      superadmin:'superadmin',responsable:'responsable',
      commercial:'commercial',promotrice:'promotrice-home'

      userId:G.user.id,
      screen:scr,
      respTab:G.respTab,
      commTab:G.commTab,

function logout(){
  /* Sauvegarder immédiatement avant déconnexion pour garantir la sync */
  if(_localDirty||_dirtyVersion>0){_supaLastSave=0;_localDirty=true;supaSave();}
  /* Fermer le drawer immédiatement */
  try{var d=document.querySelector('[data-drawer]');if(d)d.style.display='none';}catch(e){}

}

function onCommPhoto(evt){
var file=evt.target.files[0];if(!file)return;
var reader=new FileReader();
reader.onload=function(e){
var img=new Image();
img.onload=function(){
var canvas=document.createElement('canvas');
canvas.width=img.width;canvas.height=img.height;
var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);
var now=new Date();
var d=now.toLocaleDateString('fr-FR'),t=now.toTimeString().slice(0,5);
var pdv=G.db.pdvs.find(function(p){return p.id===G.commPdvId;});
var lines=[d+' '+t,pdv?pdv.nom:''].filter(Boolean);
var bh=lines.length*22+14;
ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,img.height-bh,img.width,bh);
ctx.fillStyle='#fff';ctx.font='bold 16px Arial';
lines.forEach(function(l,i){ctx.fillText(l,10,img.height-bh+18+i*22);});
G.commPromoPhotos.push({data:canvas.toDataURL('image/jpeg',0.82),date:d,time:t});
evt.target.value='';render();
};img.src=e.target.result;
};reader.readAsDataURL(file);
}

  var caller=G._promModalCaller||'comm';
  var n=(document.getElementById('mprom-nom').value||'').trim();

    role=document.getElementById('mprom-role').value||'promotrice';

function forcerPresence(){
  /* Force la présence — capture GPS et signale au superviseur */
  G.promoGpsOk=true;
  G.promoHeureDebut=tn();
  G.promoGpsRefused=false;
  var rec={
    id:uid(),promotrice_id:G.user.id,pdv_id:G.promoPdvId,
    date:TODAY,heure:tn(),gps_lat:null,gps_lng:null,signale:true
  };
  function doStore(){
    if(!G.db.forcages)G.db.forcages=[];
    G.db.forcages.push(rec);
    var pdv=(G.db.pdvs||[]).find(function(p){return p.id===rec.pdv_id;});
    var promo=G.db.utilisateurs.find(function(u){return u.id===rec.promotrice_id;});
    G.db.messages.push({
      id:uid(),org_id:G.user.org_id,
      texte:'⚠️ FORCAGE GPS : '+(promo?promo.nom:'?')+' a force sa presence sur '+(pdv?pdv.nom:'PDV inconnu')
        +' a '+rec.heure+(rec.gps_lat?' (GPS: '+rec.gps_lat.toFixed(5)+', '+rec.gps_lng.toFixed(5)+')':' (GPS non capturé)'),
      type:'forcage',auteur:'Systeme',date:new Date().toISOString(),heure:rec.heure
    });
    render();
  }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(pos){rec.gps_lat=pos.coords.latitude;rec.gps_lng=pos.coords.longitude;doStore();},
      function(){doStore();},
      {timeout:8000,enableHighAccuracy:true}
    );
  } else {
    doStore();
  }
}

function verifyGPS(){
  G.promoGpsRefused=false;
  G.promoGpsErrCode=null;
  if(!navigator.geolocation){
    G.promoGpsRefused=true;G.promoGpsErrCode=0;render();return;
  }
  /* Essai 1: position précise */
  navigator.geolocation.getCurrentPosition(
    function(pos){
      G.promoGpsLat=pos.coords.latitude;
      G.promoGpsLng=pos.coords.longitude;
      G.promoGpsRefused=false;
      var pdv=G.db.pdvs.find(function(p){return p.id===G.promoPdvId;});
      if(!pdv||!pdv.lat){G.promoGpsOk=true;}
      else{var d=gpsDistM(G.promoGpsLat,G.promoGpsLng,pdv.lat,pdv.lng);G.promoGpsOk=d<=500;}
      if(G.promoGpsOk)G.promoHeureDebut=tn();
      render();
    },
    function(err){
      /* Essai 2: position en cache (moins précis mais fonctionne si autorisé) */
      G.promoGpsErrCode=err.code;
      navigator.geolocation.getCurrentPosition(
        function(pos){
          G.promoGpsLat=pos.coords.latitude;
          G.promoGpsLng=pos.coords.longitude;
          G.promoGpsRefused=false;
          var pdv=G.db.pdvs.find(function(p){return p.id===G.promoPdvId;});
          if(!pdv||!pdv.lat){G.promoGpsOk=true;}
          else{var d=gpsDistM(G.promoGpsLat,G.promoGpsLng,pdv.lat,pdv.lng);G.promoGpsOk=d<=500;}
          if(G.promoGpsOk)G.promoHeureDebut=tn();
          render();
        },
        function(err2){
          G.promoGpsRefused=true;
          G.promoGpsErrCode=err2.code;
          G.promoGpsLat=null;G.promoGpsLng=null;
          render();
        },
        {timeout:20000,enableHighAccuracy:false,maximumAge:300000}
      );
    },
    {timeout:15000,enableHighAccuracy:true,maximumAge:60000}
  );
}

function gpsDistM(la1,lo1,la2,lo2){
var R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function onPhotoTaken(evt){
var file=evt.target.files[0];if(!file)return;
var reader=new FileReader();
reader.onload=function(e){
var img=new Image();
img.onload=function(){
var canvas=document.createElement('canvas');
canvas.width=img.width;canvas.height=img.height;
var ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0);
var now=new Date();
var dateStr=now.toLocaleDateString('fr-FR');
var timeStr=now.toTimeString().slice(0,5);
var locStr=G.promoGpsLat?G.promoGpsLat.toFixed(4)+', '+G.promoGpsLng.toFixed(4):'';
var pdv=G.db.pdvs.find(function(p){return p.id===G.promoPdvId;});
var pdvStr=pdv?pdv.nom:'';
var lines=[dateStr+' '+timeStr,pdvStr,locStr].filter(Boolean);
var bh=lines.length*22+16;
ctx.fillStyle='rgba(0,0,0,0.65)';
ctx.fillRect(0,img.height-bh,img.width,bh);
ctx.fillStyle='#fff';ctx.font='bold 16px Arial';
lines.forEach(function(l,i){ctx.fillText(l,10,img.height-bh+18+i*22);});
G.promoPhotos.push({data:canvas.toDataURL('image/jpeg',0.82),date:dateStr,time:timeStr,loc:locStr});
evt.target.value='';
render();
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
}

  var el=document.getElementById('tot-'+type+'-'+i);
  if(el)el.textContent=total;
}

function captureEvidPhoto(evt){
  var file=evt.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      canvas.width=img.width;canvas.height=img.height;
      var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);
      var now=new Date();
      var d=now.toLocaleDateString('fr-FR'),t=now.toTimeString().slice(0,5);
      var loc=G.sesGpsLat?(G.sesGpsLat.toFixed(5)+', '+G.sesGpsLng.toFixed(5)):'GPS non disponible';
      var lines=[d+' • '+t,'GPS: '+loc];
      var bh=lines.length*22+16;
      ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,img.height-bh,img.width,bh);
      ctx.fillStyle='#fff';ctx.font='bold 15px Arial';
      lines.forEach(function(l,i){ctx.fillText(l,10,img.height-bh+20+i*22);});
      /* Redimensionner si nécessaire (max 800px) */
      if(img.width>800||img.height>800){
        var ratio=Math.min(800/img.width,800/img.height);
        canvas.width=Math.round(img.width*ratio);
        canvas.height=Math.round(img.height*ratio);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
      }
      var photo=canvas.toDataURL('image/jpeg',0.5);
      G.sesPhoto=photo;
      if(!G.sesPhotos)G.sesPhotos=[];
      G.sesPhotos.push(photo);
      render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ══ COMPRESSION D'IMAGE VIA CANVAS (max 800px, JPEG 0.7) ══ */
function compressImage(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    /* Max 400px, qualité 0.5 pour rester sous 100KB */
    var MAX=400;
    var w=img.width,h=img.height;
    if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
    if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
    var canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    var ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    cb(canvas.toDataURL('image/jpeg',0.5));
  };
  img.onerror=function(){cb(dataUrl);};
  img.src=dataUrl;
}
